services:
  - type: web
    name: researchmind-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    dockerCommand: sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2 --log-level info'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: researchmind-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: researchmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: researchmind-redis
          type: keyvalue
          property: connectionString
      - key: LLM_PROVIDER
        value: demo
      - key: CORS_ORIGINS
        value: https://researchmind-web.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/researchmind-uploads

  - type: web
    name: researchmind-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://researchmind-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: researchmind-worker
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    dockerCommand: python -m app.workers.main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        fromService:
          name: researchmind-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: researchmind-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: researchmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: researchmind-redis
          type: keyvalue
          property: connectionString
      - key: LLM_PROVIDER
        value: demo

  - type: keyvalue
    name: researchmind-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: researchmind-db
    plan: free
    region: oregon
    databaseName: researchmind
    user: researchmind
    postgresMajorVersion: "16"
