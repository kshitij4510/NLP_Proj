# Production override. Requires Docker Compose 2.24.4 or later for !override.
services:
  backend:
    build:
      target: production
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    volumes: !override
      - backend_uploads:/app/uploads
      - backend_models:/app/models_cache
  worker:
    build:
      target: production
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    volumes: !override
      - backend_uploads:/app/uploads
      - backend_models:/app/models_cache
  frontend:
    build:
      target: production
      args:
        VITE_API_BASE_URL: ""
    restart: always
    ports: !override
      - "${PRODUCTION_FRONTEND_PORT:-8080}:80"
    volumes: !override []
  nginx:
    profiles: !override []
    restart: always
    volumes: !override
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
