services:
  - type: web
    name: researchmind-api-demo
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements-local.txt
    startCommand: python local_main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: demo
      - key: EMBEDDING_MODEL
        value: lexical-hash
      - key: CORS_ORIGINS
        value: https://researchmind-web-demo.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/researchmind-uploads

  - type: web
    name: researchmind-web-demo
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://researchmind-api-demo.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
