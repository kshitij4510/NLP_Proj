[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    migrations
  | .venv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["migrations/", ".venv/"]
